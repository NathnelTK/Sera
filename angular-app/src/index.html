<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TalentOS — Find Jobs & Hire Talent in Ethiopia</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TalentOS is Ethiopia's modern recruitment platform. Search thousands of jobs or hire verified talent — with Fayda identity verification.">
  <meta name="theme-color" content="#0D6EFD">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Fonts: Outfit (Headings) + Plus Jakarta Sans (UI) + Inter + Noto Sans Ethiopic (Amharic) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" media="print" onload="this.media='all'"
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap">
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap">
  </noscript>

  <!-- Material Icons (Angular Material's mat-icon). display=block hides the ligature text until
       the icon font loads, so icon names never flash on screen. Deferred like the other fonts. -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/icon?family=Material+Icons&display=block">
  <link rel="stylesheet" media="print" onload="this.media='all'"
    href="https://fonts.googleapis.com/icon?family=Material+Icons&display=block">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons&display=block">
  </noscript>
</head>
<body>
  <app-root></app-root>
</body>
</html>
